<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 900px;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .form-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .form-group {
            flex: 1;
            min-width: 200px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .model-info {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            text-align: left;
        }
        
        .model-info h3 {
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .model-charts {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        
        .chart-wrapper {
            flex: 1;
            min-width: 300px;
        }
        
        .chart-container {
            height: 200px;
            margin-top: 10px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            margin-right: 5px;
        }
        
        .tab.active {
            background-color: #667eea;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .prediction-history {
            margin-top: 20px;
            text-align: left;
        }
        
        .history-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .coefficients-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .coefficients-table th, .coefficients-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .coefficients-table th {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 House Price Predictor</h1>
        <p class="subtitle">Predict house prices based on size and features</p>
        
        <form id="predictionForm">
            <div class="form-container">
                <div class="form-group">
                    <label for="square_footage">Square Footage</label>
                    <input type="number" id="square_footage" name="square_footage" min="500" max="10000" value="2000" required>
                </div>
                
                <div class="form-group">
                    <label for="bedrooms">Number of Bedrooms</label>
                    <input type="number" id="bedrooms" name="bedrooms" min="1" max="10" value="3" required>
                </div>
                
                <div class="form-group">
                    <label for="bathrooms">Number of Bathrooms</label>
                    <input type="number" id="bathrooms" name="bathrooms" min="1" max="10" value="2" required>
                </div>
            </div>
            
            <button type="submit">Predict Price</button>
        </form>
        
        <div id="result" class="result"></div>
        
        <div class="tabs">
            <div class="tab active" data-tab="chart">Predictions Chart</div>
            <div class="tab" data-tab="history">Prediction History</div>
            <div class="tab" data-tab="model">Model Information</div>
        </div>
        
        <div class="chart-container tab-content active" id="predictions-chart">
            <canvas id="priceChart"></canvas>
        </div>
        
        <div class="prediction-history tab-content" id="history-content">
            <h3>Prediction History</h3>
            <div id="history-list"></div>
        </div>
        
        <div class="model-info tab-content" id="model-content">
            <h3>Model Information</h3>
            <div class="model-charts">
                <div class="chart-wrapper">
                    <h4>Feature Coefficients</h4>
                    <div class="chart-container">
                        <canvas id="coefficientsChart"></canvas>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <h4>Coefficient Values</h4>
                    <table class="coefficients-table">
                        <thead>
                            <tr>
                                <th>Feature</th>
                                <th>Value</th>
                            </tr>
                        </thead>
                        <tbody id="coefficients-table-body">
                            <tr>
                                <td>Square Footage</td>
                                <td id="sqft-coef-table">-</td>
                            </tr>
                            <tr>
                                <td>Bedrooms</td>
                                <td id="bedrooms-coef-table">-</td>
                            </tr>
                            <tr>
                                <td>Bathrooms</td>
                                <td id="bathrooms-coef-table">-</td>
                            </tr>
                            <tr>
                                <td>Base Price (Intercept)</td>
                                <td id="intercept-coef-table">-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize charts
        let priceChart;
        let coefficientsChart;
        let predictionHistory = [];
        let modelCoefficients = {};
        
        // Initialize the charts when the page loads
        window.addEventListener('load', function() {
            // Initialize price chart
            const priceCtx = document.getElementById('priceChart').getContext('2d');
            priceChart = new Chart(priceCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Predicted Price ($)',
                        data: [],
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.6)',
                            'rgba(118, 75, 162, 0.6)',
                            'rgba(255, 99, 132, 0.6)',
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 206, 86, 0.6)'
                        ],
                        borderColor: [
                            'rgba(102, 126, 234, 1)',
                            'rgba(118, 75, 162, 1)',
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
            
            // Initialize coefficients chart
            const coeffCtx = document.getElementById('coefficientsChart').getContext('2d');
            coefficientsChart = new Chart(coeffCtx, {
                type: 'bar',
                data: {
                    labels: ['Square Footage', 'Bedrooms', 'Bathrooms', 'Base Price'],
                    datasets: [{
                        label: 'Coefficient Value ($)',
                        data: [0, 0, 0, 0],
                        backgroundColor: [
                            'rgba(75, 192, 192, 0.6)',
                            'rgba(153, 102, 255, 0.6)',
                            'rgba(255, 159, 64, 0.6)',
                            'rgba(255, 99, 132, 0.6)'
                        ],
                        borderColor: [
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)',
                            'rgba(255, 159, 64, 1)',
                            'rgba(255, 99, 132, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
            
            // Fetch model information
            fetchModelInfo();
        });
        
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch('http://localhost:5002/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                // Check if the response is ok and has content
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                // Check if response has content before parsing as JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Response is not JSON');
                }
                return response.json();
            })
            .then(data => {
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `Predicted Price: ${data.price}`;
                    
                    // Add to prediction history
                    const prediction = {
                        square_footage: formData.get('square_footage'),
                        bedrooms: formData.get('bedrooms'),
                        bathrooms: formData.get('bathrooms'),
                        price: data.price,
                        timestamp: new Date()
                    };
                    
                    predictionHistory.unshift(prediction);
                    updatePriceChart();
                    updateHistory();
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `Error: ${data.error}`;
                }
            })
            .catch(error => {
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.textContent = `Error: ${error.message || 'Failed to get prediction'}`;
                console.error('Prediction error:', error);
            });
        });
        
        function fetchModelInfo() {
            fetch('http://localhost:5002/model_info')
            .then(response => {
                // Check if the response is ok and has content
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                // Check if response has content before parsing as JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Response is not JSON');
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    modelCoefficients = data.coefficients;
                    
                    // Update table values
                    document.getElementById('sqft-coef-table').textContent = data.coefficients.square_footage;
                    document.getElementById('bedrooms-coef-table').textContent = data.coefficients.bedrooms;
                    document.getElementById('bathrooms-coef-table').textContent = data.coefficients.bathrooms;
                    document.getElementById('intercept-coef-table').textContent = data.coefficients.intercept;
                    
                    // Update coefficients chart
                    updateCoefficientsChart(data.coefficients);
                } else {
                    console.log('Model info error:', data.error);
                }
            })
            .catch(error => {
                console.log('Error fetching model info:', error);
            });
        }
        
        function updatePriceChart() {
            // Show chart container
            document.getElementById('predictions-chart').style.display = 'block';
            
            // Limit to last 5 predictions
            const recentPredictions = predictionHistory.slice(0, 5);
            
            // Update chart data
            priceChart.data.labels = recentPredictions.map((pred, index) => 
                `House ${index + 1}`
            );
            
            priceChart.data.datasets[0].data = recentPredictions.map(pred => 
                parseFloat(pred.price.replace(/[^0-9.-]+/g,""))
            );
            
            priceChart.update();
        }
        
        function updateCoefficientsChart(coefficients) {
            // Extract numeric values from formatted strings
            const sqftValue = parseFloat(coefficients.square_footage.replace(/[^0-9.-]+/g,""));
            const bedroomsValue = parseFloat(coefficients.bedrooms.replace(/[^0-9.-]+/g,""));
            const bathroomsValue = parseFloat(coefficients.bathrooms.replace(/[^0-9.-]+/g,""));
            const interceptValue = parseFloat(coefficients.intercept.replace(/[^0-9.-]+/g,""));
            
            // Update chart data
            coefficientsChart.data.datasets[0].data = [
                sqftValue,
                bedroomsValue,
                bathroomsValue,
                interceptValue
            ];
            
            coefficientsChart.update();
        }
        
        function updateHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            predictionHistory.slice(0, 10).forEach(pred => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <strong>${pred.price}</strong> - 
                    ${pred.square_footage} sq ft, 
                    ${pred.bedrooms} bed, 
                    ${pred.bathrooms} bath
                    <small style="float: right;">${pred.timestamp.toLocaleTimeString()}</small>
                `;
                historyList.appendChild(historyItem);
            });
        }
        
        // Tab switching functionality
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // Remove active class from all tabs and content
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked tab
                this.classList.add('active');
                
                // Show corresponding content
                const tabName = this.getAttribute('data-tab');
                if (tabName === 'chart') {
                    document.getElementById('predictions-chart').classList.add('active');
                } else if (tabName === 'history') {
                    document.getElementById('history-content').classList.add('active');
                } else if (tabName === 'model') {
                    document.getElementById('model-content').classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
